# Gera o instalador do Windows e publica no GitHub Releases, com o latest.yml que a atualização
# automática do jogo lê. Só roda quando você manda (Actions → "Publicar versão" → Run workflow),
# depois de subir a versão no package.json.
name: Publicar versão

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
